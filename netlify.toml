# goupil — Netlify config
#
# No build step: the Camoufox browser can never run in a Netlify Function
# anyway (663MB archive vs 512MB /tmp cap), so pre-downloading it at build
# time only burned build minutes. Only the `plain` engine works on this host.

[build]
  command = "true"
  publish = "public"
  # Skip production builds when a push only touches CI (.github/**) or docs —
  # the deployed service is unchanged. ignore exit 0 = skip.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude).github' ':(exclude)README.md'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # The worker runs as a real `node` subprocess and resolves camoufox-js /
  # playwright-core from node_modules at runtime — keep them out of the esbuild
  # bundle and ship them as-is inside the function package.
  external_node_modules = ["camoufox-js", "playwright-core", "impit"]
  # data-files (territoryInfo.xml, webgl_data.db — ~416K) are read at runtime
  # by camoufox-js but not referenced from JS imports, so the bundler skips
  # them unless forced in.
  included_files = ["scripts/**", "node_modules/camoufox-js/dist/data-files/**"]

# No previews needed for an API service — don't burn build credits.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

