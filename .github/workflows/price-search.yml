name: price-search
# Le prix est-il sur les pages de RECHERCHE plutôt que sur les fiches ?
# On n'avait testé que des fiches — or une page de résultats existe justement
# pour afficher des tarifs, et hamak connaît l'hôtel + les dates du séjour.

on:
  workflow_dispatch:
    inputs:
      city:
        description: "Ville"
        required: false
        default: "Bruxelles"
      hotel:
        description: "Nom d'hôtel à retrouver dans les résultats"
        required: false
        default: "Juliana"
      airbnb:
        description: "Annonce Airbnb (avec des dates RÉELLEMENT disponibles)"
        required: false
        default: "https://www.airbnb.fr/rooms/602824612447596322?check_in=2027-02-11&check_out=2027-02-14&adults=2&guests=1"

jobs:
  recherche:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [booking, expedia]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: "${{ matrix.platform }} — prix en page de recherche"
        run: node .github/scripts/price-search.mjs "${{ matrix.platform }}" "${{ inputs.city }}" "${{ inputs.hotel }}"

  airbnb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: "Airbnb — le prix est-il déjà dans l'état différé ?"
        run: node .github/scripts/airbnb-price.mjs "${{ inputs.airbnb }}"

  prix-par-hotel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: "Expedia — rattacher un prix à UN hôtel"
        run: node .github/scripts/expedia-price-match.mjs "Juliana Hotel & Spa" "Bruxelles"
