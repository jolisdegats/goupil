<body style="font-family: system-ui; max-width: 40rem; margin: 4rem auto; color: #333">
  <h1>🦊 goupil</h1>
  <p>Page fetch as a service. With an <code>x-api-key</code> header and <code>{"url": "…"}</code>:
  <code>POST /fetch</code> → HTML, <code>POST /extract</code> → meta / JSON-LD / microdata / images
  and rule-based fields (deterministic, no LLM), <code>GET /engines</code> → engines learned per domain.</p>
  <p>See the repository README for the full API.</p>
</body>
